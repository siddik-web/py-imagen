services:
  local-ai-studio:
    build: .
    container_name: ai_automation_studio
    ports:
      - "7860:7860"
    environment:
      # FLUX.1-schnell is gated on Hugging Face, so the container needs a token.
      - HF_TOKEN=${HF_TOKEN:-}
      - HUGGINGFACE_HUB_TOKEN=${HUGGINGFACE_HUB_TOKEN:-}
      - FLUX_MODEL_ID=${FLUX_MODEL_ID:-black-forest-labs/FLUX.1-schnell}
      # Keep large Hugging Face model files in a persistent Docker volume.
      - HF_HOME=/models/huggingface
    volumes:
      - .:/app
      # FLUX model files are large, so keep them outside the container/image.
      - huggingface_model_cache:/models/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped

volumes:
  huggingface_model_cache:
