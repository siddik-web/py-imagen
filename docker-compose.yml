version: '3.8'

services:
  local-ai-studio:
    build: .
    container_name: ai_automation_studio
    ports:
      - "7860:7860"
    volumes:
      - .:/app
      # Cache Hugging Face models on your host machine so they don't re-download if the container resets
      - ~/.cache/huggingface:/root/.cache/huggingface
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    restart: unless-stopped